# WebForge on XAMPP Apache.
# Include from D:\xampp\apache\conf\httpd.conf with:
#   Include "D:/Semester 5/Web Programming/WebForge/backend/config/apache-webforge.conf"
#
#   /webforge/api/*  ->  backend/public/index.php   (the PHP API; config/, src/, storage/ stay unreachable)
#   /webforge/*      ->  frontend/dist-apache/       (the built React app: npm run build:apache)
#
# The more specific /webforge/api alias must come first: Apache uses the first matching Alias.
# During development, Vite (http://localhost:5173) proxies /api to /webforge/api instead.

Alias /webforge/api "D:/Semester 5/Web Programming/WebForge/backend/public"

<Directory "D:/Semester 5/Web Programming/WebForge/backend/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    # Accept requests from this machine only (local demo). Remove for a real server.
    Require local
</Directory>

Alias /webforge "D:/Semester 5/Web Programming/WebForge/frontend/dist-apache"

<Directory "D:/Semester 5/Web Programming/WebForge/frontend/dist-apache">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
</Directory>
