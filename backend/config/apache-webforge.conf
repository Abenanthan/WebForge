# WebForge API - Apache alias (XAMPP).
# Include from D:\xampp\apache\conf\httpd.conf with:
#   Include "D:/Semester 5/Web Programming/WebForge/backend/config/apache-webforge.conf"
# Only backend/public is exposed; config/, src/ and storage/ are unreachable.

Alias /webforge "D:/Semester 5/Web Programming/WebForge/backend/public"

<Directory "D:/Semester 5/Web Programming/WebForge/backend/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    # Development: accept requests from this machine only.
    Require local
</Directory>
